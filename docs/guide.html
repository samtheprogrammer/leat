<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>leat — developer guide</title>
<meta name="description" content="How to use leat: install, Iceberg & Delta, checkpoints, append/upsert modes, scaling with the elastic workers and etcd, and the CLI." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg2:#f8fafc; --border:#e2e8f0; --border-strong:#cbd5e1;
    --accent:#16a34a; --accent-dark:#15803d; --accent-soft:#dcfce7;
    --ink:#0f172a; --body:#334155; --muted:#64748b;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.7;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent-dark);text-decoration:none} a:hover{text-decoration:underline}

  /* top nav */
  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border)}
  .nav-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:22px}
  .brand{font-weight:800;font-size:1.3rem;letter-spacing:-.03em;color:var(--ink)}
  .brand span{color:var(--accent)}
  nav .links{margin-left:auto;display:flex;gap:20px;align-items:center;font-weight:500;font-size:.94rem}
  nav .links a{color:var(--muted)} nav .links a:hover{color:var(--ink);text-decoration:none}
  nav .links a.active{color:var(--accent-dark)}
  nav .gh{border:1px solid var(--border-strong);border-radius:8px;padding:6px 14px;color:var(--ink)}

  main{max-width:820px;margin:0 auto;padding:44px 24px 96px}
  .crumb{color:var(--muted);font-size:.86rem;margin:0 0 8px}

  /* markdown */
  .md h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:.2em 0 .5em;line-height:1.1}
  .md h2{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:2.2em 0 .6em;
    padding-top:1.2em;border-top:1px solid var(--border)}
  .md h2:first-of-type{border-top:0;padding-top:0}
  .md h3{font-size:1.2rem;font-weight:600;color:var(--ink);margin:1.8em 0 .5em}
  .md h4{font-size:1.02rem;font-weight:600;color:var(--ink);margin:1.5em 0 .4em}
  .md p{margin:0 0 1.1em}
  .md ul,.md ol{margin:0 0 1.1em;padding-left:1.4em} .md li{margin:.3em 0}
  .md strong{color:var(--ink);font-weight:600}
  .md a{font-weight:500}
  .md code{font-family:var(--mono);font-size:.86em;background:#f1f5f9;border:1px solid var(--border);
    padding:1px 6px;border-radius:5px;color:#0f172a}
  .md pre{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:18px 20px;overflow:auto;
    margin:0 0 1.3em}
  .md pre code{background:none;border:0;padding:0;font-size:.9rem;line-height:1.7;color:#0f172a}
  .md blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;
    margin:1.3em 0;padding:2px 18px;color:#14532d}
  .md blockquote p{margin:.7em 0}
  .md table{border-collapse:collapse;width:100%;margin:0 0 1.4em;font-size:.94rem;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--border);padding:9px 13px;text-align:left;vertical-align:top}
  .md th{background:var(--bg2);font-weight:600;color:var(--ink)}
  .md tr:nth-child(even) td{background:#fcfdfe}
  .md hr{border:0;border-top:1px solid var(--border);margin:2.4em 0}
  .loading{color:var(--muted);padding:40px 0}
  footer{border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.9rem;padding:32px 24px}

  @media(max-width:640px){ .md h1{font-size:1.9rem} nav .links a:not(.gh){display:none} }
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="brand" href="./">le<span>a</span>t</a>
    <div class="links">
      <a href="./#problems">Why</a>
      <a href="./#cost">Benchmark</a>
      <a href="guide.html" class="active">Guide</a>
      <a class="gh" href="https://github.com/samtheprogrammer/leat">GitHub ↗</a>
    </div>
  </div>
</nav>

<main>
  <p class="crumb"><a href="./">leat</a> / developer guide</p>
  <div id="content" class="md"><p class="loading">Loading the guide…</p></div>
</main>

<footer>
  leat — Apache-2.0 · <a href="https://github.com/samtheprogrammer/leat">github.com/samtheprogrammer/leat</a> ·
  <a href="https://pypi.org/project/leat/">pip install leat</a>
</footer>

<script>
  fetch('guide.md', {cache:'no-cache'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      marked.setOptions({ gfm:true, breaks:false });
      const el = document.getElementById('content');
      el.innerHTML = marked.parse(md);
      el.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch(e){} });
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        '<p>Couldn’t load the guide here. Read it on GitHub: ' +
        '<a href="https://github.com/samtheprogrammer/leat/blob/main/docs/guide.md">docs/guide.md</a>.</p>';
    });
</script>
</body>
</html>
