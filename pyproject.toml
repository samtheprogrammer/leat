[project]
name = "leat"
version = "0.1.1"
description = "Lightweight, engine-neutral incremental ETL over Iceberg & Delta — Kafka-style offsets, runs in any DAG, no cluster."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sam uddin", email = "samtheprogrammer@gmail.com" }]
keywords = ["iceberg", "delta", "lakehouse", "incremental", "etl", "streaming", "arrow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow]>=0.11",
    "fsspec",
    "pyarrow>=15",
    "polars>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
delta = ["deltalake>=1.0"]
etcd = ["etcd3", "protobuf>=4"]
dev = ["pytest", "grpcio-tools", "protobuf>=4", "numpy", "deltalake>=1.0"]

[tool.pytest.ini_options]
# Only collect the real test suite — not examples/ (whose *_test.py files match
# pytest's default glob) and not bench/.
testpaths = ["tests"]

[project.scripts]
leat = "leat.cli:main"

[project.urls]
Homepage = "https://github.com/samtheprogrammer/leat"
Repository = "https://github.com/samtheprogrammer/leat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
